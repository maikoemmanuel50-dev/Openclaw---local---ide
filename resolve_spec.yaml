project:
  name: "Africa S1 - Silicon Savannah"
  settings:
    timelineFrameRate: "24"
    timelineResolutionWidth: "1920"
    timelineResolutionHeight: "1080"

timelines:
  - name: "Episode 01 - Assembly"
    fps: 24
    markers:
      - frame: 0
        name: "Cold Open"
        note: "Scene 01 - Dawn skyline + matatus + transaction paths overlay"
      - frame: 1080
        name: "Context 2007"
        note: "Scene 02 - M-Pesa flow diagram + 2007 label"
      - frame: 2040
        name: "Beat 1 Hubs"
        note: "Scene 03-04 - iHub/Andela/NaiLab cards + Mobile-First"
      - frame: 3720
        name: "Beat 2 Money"
        note: "Scene 05-06 - $984M chart + 82% + solar morph"
      - frame: 5400
        name: "Beat 3 Gap"
        note: "Scene 07-08 - 97% map reveal + pre-seed gap"
      - frame: 6840
        name: "Closer"
        note: "Scene 09 - Forecast + global icons"
      - frame: 8280
        name: "End Card"
        note: "Scene 10 - AFRICA logo + Season 1"

  - name: "Episode 01 - Kinetic"
    fps: 24
    edit_mode: kinetic_broll
    track_layout:
      V1: "A-roll spine (Blender masters)"
      V2: "Yellow ball hero overlays"
      V3: "BROLL_A kinetic cutaways (0.4-1.0s ASL)"
      V4: "BROLL_B detail inserts / flash cuts"
      V5: "TextStat / labels"
    pacing:
      average_shot_length_sec: 0.7
      montage_cluster_cuts: "4-6 hits per 2-3s on list VO"
      protect_stats_frames: 36
    broll_sources:
      - "renders/kinetic_broll/"
      - "assets/stock/kinetic/"
      - "renders/*/hero PNG Ken Burns pulses"
    handoff: "docs/CURSOR_KINETIC_MISSION.md"
    markers:
      - frame: 0
        name: "KINETIC_COLD_OPEN"
        note: "B-roll flood 6-8 flashes first 15s + ball rise"
      - frame: 1080
        name: "KINETIC_2007"
        note: "Keypad CU montage + coin squash"
      - frame: 2040
        name: "KINETIC_HUBS"
        note: "Keyboard/whiteboard kinetic + hub orbit"
      - frame: 3720
        name: "KINETIC_MONEY"
        note: "Reduce B-roll density; protect chart"
      - frame: 5400
        name: "KINETIC_GAP"
        note: "Sparse B-roll; 97% hold"
      - frame: 6840
        name: "KINETIC_CLOSER"
        note: "High density skyline B-roll + ball reignite"
      - frame: 8280
        name: "KINETIC_END"
        note: "Minimal cuts; logo hold"

    typography_markers:
      - frame: 72
        text: "Nairobi"
        scene: S01
        style: label
      - frame: 1140
        text: "Silicon Savannah"
        scene: S01
        style: headline
      - frame: 1320
        text: "2007"
        scene: S02
        style: stat
      - frame: 1380
        text: "M-PESA"
        scene: S02
        style: headline
      - frame: 2280
        text: "iHub 2010"
        scene: S03
        style: label
      - frame: 4080
        text: "$984M"
        scene: S05
        style: stat
      - frame: 4680
        text: "82%"
        scene: S05
        style: stat
      - frame: 5880
        text: "97%"
        scene: S07
        style: stat
      - frame: 8040
        text: "Forecast"
        scene: S09
        style: headline

    audio_chapters:
      - id: dawn
        start_frame: 0
        end_frame: 2040
        music: "assets/audio/music/ch01_dawn_pad.wav"
      - id: daylight
        start_frame: 2040
        end_frame: 3720
        music: "assets/audio/music/ch02_daylight_lofi.wav"
      - id: darkdata
        start_frame: 3720
        end_frame: 5400
        music: "assets/audio/music/ch03_darkdata_electronic.wav"
      - id: cooltension
        start_frame: 5400
        end_frame: 6840
        music: "assets/audio/music/ch04_cooltension_drone.wav"
      - id: hopefuldusk
        start_frame: 6840
        end_frame: 10080
        music: "assets/audio/music/ch05_hopeful_dusk.wav"

    transitions:
      - from: S01
        to: S02
        type: cut
      - from: S02
        to: S03
        type: wipeleft
        duration_frames: 7
      - from: S04
        to: S05
        type: cut
      - from: S05
        to: S06
        type: morph
        duration_frames: 15
      - from: S06
        to: S07
        type: cut
      - from: S07
        to: S08
        type: fade
        duration_frames: 8
      - from: S08
        to: S09
        type: cut
      - from: S09
        to: S10
        type: fade
        duration_frames: 12

    luts:
      - chapter: dawn
        scenes: [S01, S02]
        file: "templates/resolve/luts/LUT_Dawn.cube"
      - chapter: daylight
        scenes: [S03, S04]
        file: "templates/resolve/luts/LUT_Daylight.cube"
      - chapter: darkdata
        scenes: [S05, S06]
        file: "templates/resolve/luts/LUT_DarkData.cube"
      - chapter: cooltension
        scenes: [S07, S08]
        file: "templates/resolve/luts/LUT_CoolTension.cube"
      - chapter: hopefuldusk
        scenes: [S09, S10]
        file: "templates/resolve/luts/LUT_HopefulDusk.cube"

deliverables:
  silent: "Africa_S1_Silicon_Savannah_7min.mp4"
  final: "Africa_S1_Silicon_Savannah_FINAL.mp4"
  vo: "assets/audio/vo/episode_01_vo.wav"
