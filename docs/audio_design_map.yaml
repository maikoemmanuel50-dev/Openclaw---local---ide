# AFRICA S1 Episode 01 — Audio Design Map
# Refs:
#   TED-Ed https://youtu.be/2A1IEBFt6Xg
#   Bloomberg Originals https://youtu.be/d2dgJGkw5p0
#   Search Party https://youtu.be/5xm_luvYoc8
#   docs/AUDIO_MIX_STANDARDS.md
# Sync all timings to final VO track post-record (episode_01_vo.wav)

project:
  name: "Africa S1 - Silicon Savannah"
  vo_file: "assets/audio/vo/episode_01_vo.wav"
  sample_rate: 48000
  bit_depth: 24
  fps: 24
  target_runtime_sec: 420

mix:
  vo_reference_db: 0
  music_under_vo_db: -24
  music_swell_db: -12
  music_gap_swell_relative_db: 6
  ambient_sfx_db: -28
  punctuation_sfx_db: -18
  stat_impact_sfx_db: -14
  duck_amount_db: -18
  duck_attack_ms: 18
  duck_release_ms: 200
  pre_reveal_dip_db: -6
  pre_reveal_dip_duration_sec: 0.5
  program_lufs: -14
  true_peak_dbtp: -1

# ── Chapter Music Beds ──────────────────────────────────────────────
chapters:
  - id: dawn
    scenes: [S01, S02]
    bed: "assets/audio/music/ch01_dawn_pad.wav"
    bpm: 90
    mood: "Gentle synth pad, warm, rising"
    entry: "S01 frame 0"
    exit: "S02 end — crossfade 2s to daylight"
    crossfade_to: daylight

  - id: daylight
    scenes: [S03, S04]
    bed: "assets/audio/music/ch02_daylight_lofi.wav"
    bpm: 100
    mood: "Light lo-fi rhythm, driving but soft"
    entry: "S03 frame 0"
    exit: "S04 end — cut to darkdata"
    crossfade_to: darkdata

  - id: darkdata
    scenes: [S05, S06]
    bed: "assets/audio/music/ch03_darkdata_electronic.wav"
    bpm: 110
    mood: "Electronic pulse, data-forward"
    entry: "S05 frame 0"
    exit: "S06 end — fade 1s to cooltension"
    crossfade_to: cooltension

  - id: cooltension
    scenes: [S07, S08]
    bed: "assets/audio/music/ch04_cooltension_drone.wav"
    bpm: 80
    mood: "Introspective drone, sparse"
    entry: "S07 frame 0 — with pre-reveal dip"
    exit: "S08 end — cut to hopefuldusk"
    crossfade_to: hopefuldusk

  - id: hopefuldusk
    scenes: [S09, S10]
    bed: "assets/audio/music/ch05_hopeful_dusk.wav"
    bpm: 95
    mood: "Warm swell, Kenyan percussion + synth"
    entry: "S09 frame 0 — swell from silence"
    exit: "S10 frame 300 — resolve chord, decay 2s"
    resolve: "assets/audio/sfx/music_resolve.wav"

# ── Section Reset Points (match resolve_spec.yaml markers) ──────────
section_resets:
  - frame: 0
    name: "Cold Open"
    music_chapter: dawn
  - frame: 1080
    name: "Context 2007"
    music_chapter: dawn
  - frame: 2040
    name: "Beat 1 Hubs"
    music_chapter: daylight
  - frame: 3720
    name: "Beat 2 Money"
    music_chapter: darkdata
  - frame: 5400
    name: "Beat 3 Gap"
    music_chapter: cooltension
  - frame: 6840
    name: "Closer"
    music_chapter: hopefuldusk
  - frame: 8280
    name: "End Card"
    music_chapter: hopefuldusk

# ── SFX Inventory ───────────────────────────────────────────────────
sfx_library:
  # Ambient beds (continuous per scene)
  - id: city_morning_ambient
    file: "assets/audio/sfx/city_morning_ambient.wav"
    type: ambient
    level_db: -24
    scenes: [S01]

  - id: street_bustle
    file: "assets/audio/sfx/street_bustle.wav"
    type: ambient
    level_db: -24
    scenes: [S02]

  - id: coworking_chatter
    file: "assets/audio/sfx/coworking_chatter.wav"
    type: ambient
    level_db: -24
    scenes: [S03]

  - id: solar_hum
    file: "assets/audio/sfx/solar_hum.wav"
    type: ambient
    level_db: -24
    scenes: [S06]

  - id: drone_ambient
    file: "assets/audio/sfx/drone_ambient.wav"
    type: ambient
    level_db: -26
    scenes: [S07, S08]

  # Punctuation one-shots (triggered by VO words)
  - id: matatu_horn
    file: "assets/audio/sfx/matatu_horn.wav"
    type: punctuation
    level_db: -18
    trigger_word: "matatus"
    scene: S01

  - id: transaction_chime
    file: "assets/audio/sfx/transaction_chime.wav"
    type: punctuation
    level_db: -18
    trigger_word: "money has already moved"
    scene: S01

  - id: brand_sting
    file: "assets/audio/sfx/brand_sting.wav"
    type: punctuation
    level_db: -18
    trigger_word: "M-Pesa"
    scene: S02

  - id: keypad_click
    file: "assets/audio/sfx/keypad_click.wav"
    type: punctuation
    level_db: -18
    trigger_word: "text message"
    scene: S02

  - id: keyboard_clack
    file: "assets/audio/sfx/keyboard_clack.wav"
    type: punctuation
    level_db: -20
    trigger_word: "desks"
    scene: S03

  - id: ui_swipe
    file: "assets/audio/sfx/ui_swipe.wav"
    type: punctuation
    level_db: -18
    trigger_word: "phone"
    scene: S04

  - id: chart_riser
    file: "assets/audio/sfx/chart_riser.wav"
    type: punctuation
    level_db: -18
    trigger_word: "measurable"
    scene: S05

  - id: stat_ping
    file: "assets/audio/sfx/stat_ping.wav"
    type: stat_impact
    level_db: -14
    trigger_word: "a billion dollars"
    scene: S05

  - id: stat_impact_82
    file: "assets/audio/sfx/stat_impact.wav"
    type: stat_impact
    level_db: -14
    trigger_word: "eighty-two percent"
    scene: S05

  - id: stat_impact_97
    file: "assets/audio/sfx/stat_impact.wav"
    type: stat_impact
    level_db: -14
    trigger_word: "ninety-seven percent"
    scene: S07
    pre_reveal_dip: true

  - id: logo_fade
    file: "assets/audio/sfx/logo_fade.wav"
    type: punctuation
    level_db: -20
    trigger_word: "Microsoft"
    scene: S09

  - id: logo_fade_visa
    file: "assets/audio/sfx/logo_fade.wav"
    type: punctuation
    level_db: -20
    trigger_word: "Visa"
    scene: S09

  - id: logo_fade_un
    file: "assets/audio/sfx/logo_fade.wav"
    type: punctuation
    level_db: -20
    trigger_word: "United Nations"
    scene: S09

  - id: music_resolve
    file: "assets/audio/sfx/music_resolve.wav"
    type: resolve
    level_db: -10
    trigger: "S10 frame 300"
    scene: S10

