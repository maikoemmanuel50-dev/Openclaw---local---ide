# ── Fairlight Bus Layout ────────────────────────────────────────────
fairlight_buses:
  - name: "VO"
    type: track
    channels: 1
    level_db: 0

  - name: "Music"
    type: track
    channels: 2
    level_db: -22
    duck_source: "VO"
    duck_amount_db: -12

  - name: "Ambient SFX"
    type: track
    channels: 2
    level_db: -24

  - name: "Punctuation SFX"
    type: track
    channels: 2
    level_db: -18

  - name: "Stat Impact"
    type: track
    channels: 2
    level_db: -14

# ── Placeholder VO (TTS) ─────────────────────────────────────────────
placeholder_vo:
  enabled: true
  file: "assets/audio/vo/episode_01_vo_placeholder.wav"
  generator: "generate_placeholder_vo.py"
  note: "Replace with recorded VO; re-slip all cues to final timestamps"
